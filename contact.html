        <section class="content-section"> 
            <h1>Contact Me</h1>
            <!--REMEMBER: Using Formspree to test form backend.-->
            <!--CONSIDER a honeypot field to deter spam-->
            <form action="https://formspree.io/f/mrppzord" method="POST" id="contact-form">
                
                <div class="form-group">
                    <label for="name">Who are you?</label>
                    <input type="text" id="name"
                            name="name"
                            placeholder="Your name*" required>
                    <span class="error-message" id="nameError"></span>


                    <label for="Your email address"></label>
                    <input type="text" id="email"
                            name="visitorEmail"
                            placeholder="Your email address*" required>
                    <span class="error-message" id="emailError"></span>

                    

                    <label for="message">How can I help?</label>
                    <textarea id="message"
                            name="visitorMessage"
                            placeholder="Please enter your message here*" 
                            rows=5 required></textarea>
                    <span class="error-message" id="messageError"></span>

                    <button type="submit" class="visit-btn">Send</button>
                </div>

            </form>
        </section>   
    </main>
